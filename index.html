    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Modern Minimalist Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(15, 117, 111, 0.1);
            border-radius: 10px;
            transition: background 0.3s ease;
        }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb {
            background: rgba(15, 117, 111, 0.3);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            overscroll-behavior-y: none;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {

                        secondary: '#1d9ec9',
                        accent: '#ED7D3A',
                        background: '#f9fafa',
                        'surface-dark': '#1a1d21',
                        'success': '#2DA64A',
                        'warning': '#E68A1A',
                        'danger': '#e73508'
                    },
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],

                    }
                }
            }
        }
    </script>
